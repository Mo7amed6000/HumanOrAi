<!DOCTYPE html>
<html>
<head>
    <title>Text Classifier</title>
</head>
<body>
    <h1>AI vs Human Text Classifier</h1>
    <form method="post" >
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Classify</button>
    </form>

    {% if result %}
        <h2>Result: {{ result }} with confidence of : {{ number }}</h2>
    {% endif %}
</body>
</html>
